# print-mode.ts:80-101 uses the same runtime command actions for JSON mode.
# The artifact contains only lifecycle/order/history facts, with no volatile
# values; artifact_normalized_equal does not remove any content from it.
name = "40-json-extension-session-replacement"
description = "JSON-mode extension commands replace sessions and preserve cancellation"
covers = ["packages/coding-agent/src/modes/print-mode.ts", "packages/coding-agent/src/core/agent-session-runtime.ts"]
tags = ["hermetic", "fast"]
driver = "cli-mode"

[cli]
args = ["--model", "test-faux/faux-1", "--no-session", "--mode", "json", "/replace-probe resume {{TEMP}}/trace.jsonl", "/replace-probe at {{TEMP}}/trace.jsonl", "/replace-probe before {{TEMP}}/trace.jsonl", "/replace-probe cancel {{TEMP}}/trace.jsonl", "/replace-probe new {{TEMP}}/trace.jsonl"]
timeout_seconds = 30
artifact_path = "{{TEMP}}/trace.jsonl"

[env]
pig = ["PIG_TEST_FAUX=1"]
pig_extensions = ["testdata/ext/session-replacement.mjs"]
pi_extensions = ["../../testdata/test-faux-provider.ts", "testdata/ext/session-replacement.mjs"]

[assert]
exit_code = 0
runs = 3
artifact_normalized_equal = true
artifact_both_contain = ['["result","resume",false]', '["result","at",false]', '["result","before",false]', '["result","cancel",true]', '["result","new",false]']
both_not_contain = ["unsupported", "Extension error"]
